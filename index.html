<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tresor knacken</title>
<style>
:root{--bg:#19182f;--card:#282751;--card2:#37356e;--ink:#fff8e7;--dim:#c9c6f5;--sun:#ffd23f;--mint:#53dbbc;--coral:#ff7a7a;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Trebuchet MS","Avenir Next",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:clamp(2rem,8vw,3rem);line-height:1.05;margin:0 0 8px;letter-spacing:-.02em}
.sub{margin:0 0 22px;color:var(--dim)}
.vault{position:relative;margin:0 0 8px;padding:22px 18px 18px;border-radius:24px;border:6px solid #141a20;background:linear-gradient(145deg,#6b7c8c,#3a4755 55%,#4a5967);box-shadow:inset 0 0 0 3px #8fa0ae,0 8px 0 #0f1419,0 18px 28px rgba(0,0,0,.45)}
.bolt{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d5dde4,#56626d);box-shadow:0 1px 2px #000}
.b1{top:8px;left:8px}.b2{top:8px;right:8px}.b3{bottom:8px;left:8px}.b4{bottom:8px;right:8px}
.vtop{display:flex;align-items:center;gap:14px;margin:0 0 14px}
.wheel{width:76px;height:76px;flex:none;transition:transform .9s cubic-bezier(.3,1.3,.5,1);filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))}
.state{display:flex;flex-direction:column;gap:2px}
.vtitle{font-weight:700;font-size:1.2rem}
.led{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--coral);box-shadow:0 0 10px var(--coral);margin-right:8px;vertical-align:-1px}
.open .led{background:var(--mint);box-shadow:0 0 12px var(--mint)}
.vcount{color:#e3eaf0;font-size:.95rem}
.secret{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:14px 10px;margin:0 0 14px;border-radius:12px;background:#0a1512;border:3px solid #1c2a27;box-shadow:inset 0 3px 10px #000}
.open .secret{border-color:var(--mint);box-shadow:inset 0 3px 10px #000,0 0 18px rgba(79,227,193,.5)}
.ch{width:clamp(28px,9vw,40px);height:clamp(40px,11vw,52px);display:flex;align-items:flex-end;justify-content:center;border-bottom:3px solid #2f7d6d;font:700 clamp(1.4rem,6.5vw,2rem)/1.2 ui-monospace,"Courier New",monospace;color:var(--mint);text-shadow:0 0 8px var(--mint)}
.ch.pop{animation:pop .5s ease}
@keyframes pop{30%{transform:translateY(-10px) scale(1.3)}}
.final{display:flex;gap:8px}
.final input{text-align:center;letter-spacing:.12em;font-family:ui-monospace,"Courier New",monospace;background:#0a1512;border-color:#1c2a27}
.final input:focus{border-color:var(--mint)}
input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:2px solid var(--card2);background:#16154a;color:var(--ink)}
input::placeholder{color:#8f8cd0}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--sun);color:#1f1d5c}
button:hover{filter:brightness(1.08)}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.note{min-height:1.5em;margin:8px 0 0;color:var(--mint);font-weight:700}
.warn{background:var(--coral);color:#2a0d0d;padding:8px 12px;border-radius:10px;margin:0 0 16px;font-weight:700}
#win{background:var(--mint);color:#0c2b25;border-radius:14px;padding:16px 18px;margin:14px 0 0;animation:pop .5s ease}
#win h2{margin:0 0 4px;font-size:1.5rem}
#win p{margin:0}
.card{background:var(--card);border-radius:16px;padding:18px;margin-top:16px;border-left:6px solid var(--card2)}
.card.done{border-left-color:var(--mint);opacity:.9}
.card.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2{margin:0;font-size:1.1rem}
.badge{background:var(--mint);color:#0c2b25;font-weight:700;border-radius:99px;padding:2px 12px;font-size:.9rem}
.q{margin:8px 0 12px}
.show{font:700 1.3rem/1.4 ui-monospace,"Courier New",monospace;background:#16154a;border-radius:10px;padding:10px 14px;margin:0 0 12px;overflow-wrap:anywhere;color:var(--sun)}
.row{display:flex;gap:8px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.choice{background:var(--card2);color:var(--ink);text-align:left;font-weight:400}
.msg{min-height:1.4em;margin:8px 0 0;color:var(--coral);font-weight:700}
.hint{background:none;color:var(--dim);padding:4px 0;text-decoration:underline;font-weight:400}
.hinttxt{margin:4px 0 0;color:var(--dim)}
.ok{margin:0;color:var(--mint);font-weight:700}
footer{margin-top:28px;text-align:center}
footer button{background:none;color:var(--dim);font-weight:400;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.ch.pop,.card.shake,#win{animation:none}.wheel{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Knack den Tresor</h1>
    <p class="sub">Löse jedes Rätsel, um einen Buchstaben des geheimen Passworts zu enthüllen, du darfst für die Fragen auch KI verwenden. Wenn du das Passwort kennst, gibs unten ein!</p>
    <div id="dev"></div>
    <div id="vault" class="vault">
      <span class="bolt b1"></span><span class="bolt b2"></span><span class="bolt b3"></span><span class="bolt b4"></span>
      <div class="vtop">
        <svg id="wheel" class="wheel" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="46" fill="#2a343e" stroke="#9fb0bd" stroke-width="4"/>
          <g stroke="#c4d0d9" stroke-width="7" stroke-linecap="round">
            <line x1="50" y1="12" x2="50" y2="88"/><line x1="12" y1="50" x2="88" y2="50"/>
            <line x1="23" y1="23" x2="77" y2="77"/><line x1="77" y1="23" x2="23" y2="77"/>
          </g>
          <circle cx="50" cy="50" r="13" fill="#ffd23f" stroke="#8a6d00" stroke-width="3"/>
        </svg>
        <div class="state">
          <span class="vtitle"><i class="led"></i><span id="vstate">Gesperrt</span></span>
          <span id="vcount" class="vcount"></span>
        </div>
      </div>
      <div id="secret" class="secret" aria-label="Geheimes Passwort"></div>
      <div class="final">
        <input id="pw" placeholder="Geheimes Passwort" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
        <button id="pwBtn">Entsperren</button>
      </div>
      <p id="pwMsg" class="note"></p>
      <section id="win" hidden></section>
    </div>
  </header>
  <section id="list"></section>
  <footer><button id="reset">Neu starten</button></footer>
</main>


<script>
/* ============ EDIT HERE ============
   - secret: the password (letters/numbers only). Puzzle number 1 reveals letter 1, puzzle 2 reveals letter 2, ...
     so you need exactly as many puzzles as letters.
   - Puzzle types:  choice  -> has "choices" and one "answer" (text must match a choice)
                    text    -> typed answer; "answer" can be a list of accepted answers
   - Optional: "show" = a code/cipher displayed in a box, "hint" = hidden until clicked.
   - Company puzzles are marked TODO. */
const CONFIG = {
  secret: "WELCOME2VPB2026",
  winTitle: "Zugang gewährt! 🎉",
  winText: "Du hast den Code geknackt. Gratuliere!",
  puzzles: [
    { title: "Das Ungewöhnliche", 
      q: "Welches dieser Dinge ist KEIN Webbrowser?",
      choices: ["Tor", "Firefox", "Bing", "Safari"], 
      answer: "Bing" },

    { title: "Unser Gründer", 
      q: "Wie heisst der Gründer der VP Bank?",
      answer: ["Guido Feger"] },

    { title: "Mitarbeiter der VP Bank", 
      q: "Wie viele Mitarbeiter (alle Standorte) hat die VP Bank?",
      choices: ["600", "1000", "3000", "1250"], 
      answer: "1000" },

    { title: "Passwort-Stärke", 
      q: "Welches Passwort wäre für einen Hacker am schwersten zu erraten?",
      choices: ["password123", "M2K82M31UEL9", "T7#kq9!Lm2$x", "12345678"], 
      answer: "T7#kq9!Lm2$x" },

    { title: "Wo befindet sich E-Banking?", 
      q: "In Welchem Stockwerk befindet sich das Team E-Banking (EBI)?",
      choices: ["Im dritten Stockwerk", "Im zweiten Stockwerk", "Im ersten Stockwerk"], 
      answer: "Im dritten Stockwerk",
      hint: "Fragt nach oder geht suchen!"},

    { title: "Gründungsjahr VP Bank", 
      q: "In welchem Jahr wurde die VP Bank gegründet?",
      answer: ["1956"] },

    { title: "Standorte der VPB", 
      q: "Wie viele Standorte hat die VP Bank? (Vaduz und Triesen zählen als ein Standort!)",
      choices: ["2", "5", "7"], 
      answer: "5" },

    { title: "Bildformate?" , 
      q: "Welches dieser Dateiformate ist KEIN Bildformat?",
      choices: [".avif", ".xm", ".bmp", ".jxl"], 
      answer: ".xm" },

    {
      title: "Die Spitze", 
      q: "Wie heisst der CEO der VP Bank?",
      answer: "Urs Monstein"
    },

    { title: "Geheime-Chiffre", 
      q: "Jeder Buchstabe wurde im Alphabet um eine gewisse anzahl verschoben. Verschiebe sie wieder zurück, um den text zu entschlüsseln.",
      show: "Dupumwlcjn", 
      answer: ["Javascript"], 
      hint: "Benutze die Cäsar-Chiffre - D verschiebt sich zu J. Jetzt der Rest!" },
    
    { title: "Beende den Satz", 
      q: "Die VP Bank ist die...",
      choices: ["zweitgrösste Bank in Liechtenstein.", "drittgrösste Bank in Liechtenstein.", "grösste Bank in Liechtenstein."], 
      answer: "drittgrösste Bank in Liechtenstein." },

    { title: "Domain Name System", 
      q: "Was ist die Hauptaufgabe eines DNS-Servers?",
      choices: ["Verschlüsselung von E-Mails", "Namensauflösung von Domains in IP-Adressen", "Kompression von Datenpaketen", "Speicherung von Passwörtern"], 
      answer: "Namensauflösung von Domains in IP-Adressen" },

    { title: "Verschiedene Programmiersprachen...", 
      q: "Welche von diesen Programmiersprachen benutzen wir am häufigsten in der Bank?",
      choices: ["Rust", "Haskell", "Java"], 
      answer: "Java" },

    { title: "Binärdecoder", 
      q: "Computer sprechen in 1en und 0en. Jede Gruppe aus 8 ist ein Buchstabe. Welches Wort ist das?",
      show: "01000011 01000001 01010100 01010011", 
      answer: ["CATS"],
      hint: "Schau dir eine ASCII-Tabelle an..." },

    { title: "Chaos?", 
      q: "Dieses Wort ist mit dem Schlüssel 'VPB' chiffriert... Kannst du es entschlüsseln?",
      show: "Zh jni ezg Ojkfhqfm", 
      answer: ["Es ist der November"], 
      hint: "Benutze die Viginère-Chiffre..." },
  ]
};

/* ============ END OF EDIT AREA ============ */

const SECRET = CONFIG.secret.toUpperCase().replace(/[^A-Z0-9]/g, "");
const KEY = "crackthecode:" + SECRET;
let state = { solved: {}, won: false };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.solved) state = s; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const $ = id => document.getElementById(id);
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, "");
const h = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

function renderSecret(popIdx) {
  const box = $("secret"); box.replaceChildren();
  [...SECRET].forEach((c, i) => {
    const s = h("span", "ch" + (i === popIdx ? " pop" : ""), state.solved[i] || state.won ? c : "");
    box.append(s);
  });
}

function checkAll() {
  const all = SECRET.length > 0 && [...SECRET].every((_, i) => state.solved[i]);
  $("pwMsg").textContent = all && !state.won ? "Alle Buchstaben gefunden! Gib das Passwort oben ein." : "";
}

function showWin() {
  const w = $("win"); w.hidden = false; w.replaceChildren(h("h2", "", CONFIG.winTitle), h("p", "", CONFIG.winText));
  $("pwMsg").textContent = "";
}

function card(i) {
  const p = CONFIG.puzzles[i], el = h("article", "card");
  const answers = [].concat(p.answer);
  function draw() {
    el.replaceChildren();
    el.classList.toggle("done", !!state.solved[i]);
    const head = h("div", "head");
    head.append(h("h2", "", p.title || "Rätsel " + (i + 1)));
    if (state.solved[i]) head.append(h("span", "badge", "Zeichen " + (i + 1) + ": " + SECRET[i]));
    el.append(head, h("p", "q", p.q));
    if (p.show) el.append(h("div", "show", p.show));
    if (state.solved[i]) { el.append(h("p", "ok", "✔ Gelöst!")); return; }
    const msg = h("p", "msg", "");
    if (p.choices) {
      const box = h("div", "choices");
      p.choices.forEach(c => { const b = h("button", "choice", c); b.onclick = () => attempt(c); box.append(b); });
      el.append(box);
    } else {
      const row = h("div", "row"), inp = h("input");
      inp.placeholder = "Gib deine Antwort ein"; inp.autocomplete = "off"; inp.autocapitalize = "off";
      inp.spellcheck = false; inp.enterKeyHint = "go";
      const go = h("button", "", "Prüfen");
      go.onclick = () => attempt(inp.value);
      inp.onkeydown = e => { if (e.key === "Enter") attempt(inp.value); };
      row.append(inp, go); el.append(row);
    }
    el.append(msg);
    if (p.hint) {
      const hb = h("button", "hint", "Brauchst du einen Hinweis?");
      hb.onclick = () => hb.replaceWith(h("p", "hinttxt", "💡 " + p.hint));
      el.append(hb);
    }
    function attempt(v) {
      if (!p.choices && !norm(v)) { msg.textContent = "Gib zuerst etwas ein!"; return; }
      const good = p.choices ? v === answers[0] : answers.some(a => norm(a) === norm(v));
      if (good) { state.solved[i] = true; save(); draw(); renderSecret(i); checkAll(); }
      else {
        msg.textContent = ["Nicht ganz, versuch es noch einmal!", "Nah dran, aber nein.", "Falsche Antwort!"][Math.floor(Math.random() * 3)];
        el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
      }
    }
  }
  draw();
  return el;
}

function build() {
  $("list").replaceChildren(...CONFIG.puzzles.map((_, i) => card(i)));
  renderSecret();
  $("win").hidden = true;
  if (state.won) showWin();
  checkAll();
}

function tryPassword() {
  const v = $("pw").value;
  if (!norm(v)) return;
  if (norm(v) === norm(SECRET)) { state.won = true; save(); renderSecret(); showWin(); }
  else $("pwMsg").textContent = "Das ist noch nicht das richtige Passwort. Löse mehr Rätsel für mehr Buchstaben!";
}
$("pwBtn").onclick = tryPassword;
$("pw").onkeydown = e => { if (e.key === "Enter") tryPassword(); };
$("reset").onclick = () => {
  if (confirm("Neu starten? Dein Fortschritt geht verloren.")) { state = { solved: {}, won: false }; save(); $("pw").value = ""; build(); }
};

if (CONFIG.puzzles.length !== SECRET.length) {
  const d = h("p", "warn", "Setup-Check: Es gibt " + CONFIG.puzzles.length + " Rätsel, aber das Geheimwort hat " + SECRET.length + " Buchstaben. Diese müssen übereinstimmen.");
  $("dev").append(d);
}

build();
</script>
</body>
</html>
